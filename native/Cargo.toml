[package]
name = "otools-localsend-native"
version = "0.1.0"
description = "LocalSend business core for the OTools native plugin ABI"
authors = ["xyito"]
edition = "2021"
autobins = false

[lib]
name = "otools_localsend_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util"] }
socket2 = "0.6"
directories = "5"
sha2 = "0.10"
base64 = "0.22"
rcgen = "0.13"
time = "0.3"
axum = "0.7"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
http-body-util = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio-stream = "0.1"

[profile.dev]
debug = 0

[profile.test]
debug = 0
